<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Selected Works — Dang Pham</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="works-page">


    <!-- CURSOR -->

    <div
        class="cursor"
        id="cursor"
    >
        <span>VIEW</span>
    </div>



    <!-- NAV -->

    <header
        class="top-bar works-nav"
    >


        <a
            href="index.html"
            class="site-name"
            data-cursor="HOME"
        >
            DANG PHAM
        </a>


        <nav
            class="navigation"
        >

            <a
                href="works.html"
                data-cursor="INDEX"
            >
                INDEX
            </a>

            <a
                 href="about.html"
    data-cursor="ABOUT"
            >
                ABOUT
            </a>

        </nav>


    </header>



    <!-- ==========================================
         WORKS HEADER
    =========================================== -->

    <main
        class="works-main"
    >


        <section
            class="works-page-header"
        >


            <div
                class="section-header"
            >

                <span>
                    01 / PROJECT INDEX
                </span>

                <span>
                    SELECTED WORK
                </span>

            </div>


            <h1>

                SELECTED<br>
                WORKS

            </h1>


        </section>



        <!-- ======================================
             FILTERS
        ======================================= -->

        <section
            class="filter-section"
        >


            <div
                class="filter-label"
            >
                FILTER
            </div>


            <div
                class="filter-buttons"
                id="filterButtons"
            ></div>


        </section>



        <!-- ======================================
             PROJECT GRID
        ======================================= -->

        <section
            class="works-grid"
            id="worksGrid"
        ></section>


    </main>



    <!-- ==========================================
         PROJECT MODAL
    =========================================== -->

    <div
        class="project-modal"
        id="projectModal"
    >


        <div
            class="modal-backdrop"
            id="modalBackdrop"
        ></div>


        <article
            class="modal-box"
        >


            <!-- MEDIA -->

            <div
                class="modal-media"
            >


                <div
                    class="modal-media-stage"
                    id="modalMediaStage"
                ></div>


                <button
                    class="modal-arrow modal-prev"
                    id="modalPrev"
                    aria-label="Previous image"
                >
                    ←
                </button>


                <button
                    class="modal-arrow modal-next"
                    id="modalNext"
                    aria-label="Next image"
                >
                    →
                </button>


                <div
                    class="modal-counter"
                    id="modalCounter"
                >
                    01 / 01
                </div>


            </div>



            <!-- INFO -->

            <div
                class="modal-info"
            >


                <div
                    class="modal-heading"
                >

                    <div>

                        <h2
                            id="modalTitle"
                        ></h2>

                        <span
                            id="modalYear"
                        ></span>

                    </div>


                    <button
                        class="modal-close"
                        id="modalClose"
                    >
                        
                    </button>

                </div>



                <div
                    class="modal-tags"
                    id="modalTags"
                ></div>



                <p
                    class="modal-description"
                    id="modalDescription"
                ></p>


            </div>


        </article>


    </div>



    <script
        src="js/content.js"
    ></script>


    <script
        src="js/app.js"
    ></script>


</body>

</html>
